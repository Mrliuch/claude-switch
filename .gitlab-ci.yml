stages:
  - release

variables:
  BINARY: claude-switch
  DOCKER_BUILDKIT: "1"
  # Harbor 中的 Go 镜像地址，在 GitLab → Settings → CI/CD → Variables 中设置：
  #   HARBOR_REGISTRY   : harbor.example.com
  #   HARBOR_PROJECT    : library
  #   HARBOR_USERNAME   : robot$ci
  #   HARBOR_PASSWORD   : <robot-token>
  GO_IMAGE: "$HARBOR_REGISTRY/$HARBOR_PROJECT/golang:1.25-alpine"

release:
  stage: release
  # Runner 已挂载宿主 Docker socket，使用 docker CLI 镜像即可，无需 DinD
  image: docker:24-cli
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  before_script:
    - docker login -u "$HARBOR_USERNAME" -p "$HARBOR_PASSWORD" "$HARBOR_REGISTRY"
    - apk add --no-cache curl python3
  script:
    # ── 交叉编译 5 个平台（在 Harbor 的 Go 镜像容器内执行）────────
    - |
      echo "==> 编译 ${CI_COMMIT_TAG}"
      docker run --rm \
        -v "$(pwd):/app" \
        -w /app \
        "$GO_IMAGE" \
        sh -c '
          set -e
          mkdir -p dist

          build() {
            goos=$1; goarch=$2; ext=${3:-}
            name="'"${BINARY}"'-${goos}-${goarch}${ext}"
            printf "  %-40s" "${name}"
            CGO_ENABLED=0 GOOS=${goos} GOARCH=${goarch} \
              go build -ldflags="-s -w" -o "dist/${name}" .
            echo "✓"
          }

          build darwin  amd64
          build darwin  arm64
          build linux   amd64
          build linux   arm64
          build windows amd64 .exe
        '

    # ── 上传到 Package Registry ────────────────────────────────────
    - |
      echo "==> 上传到 Package Registry"
      for file in dist/*; do
        name=$(basename "${file}")
        printf "  %-40s" "${name}"
        curl -sf \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${file}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${BINARY}/${CI_COMMIT_TAG}/${name}"
        echo "✓"
      done

    # ── 创建 GitLab Release ────────────────────────────────────────
    - |
      echo "==> 创建 Release ${CI_COMMIT_TAG}"
      python3 - <<'PYEOF'
      import json, urllib.request, urllib.error, os

      token   = os.environ["CI_JOB_TOKEN"]
      api     = f"{os.environ['CI_API_V4_URL']}/projects/{os.environ['CI_PROJECT_ID']}/releases"
      binary  = os.environ["BINARY"]
      version = os.environ["CI_COMMIT_TAG"]
      base    = f"{os.environ['CI_SERVER_URL']}/{os.environ['CI_PROJECT_PATH']}/-/packages/generic/{binary}/{version}"

      platforms = [
          ("darwin",  "amd64", ""),
          ("darwin",  "arm64", ""),
          ("linux",   "amd64", ""),
          ("linux",   "arm64", ""),
          ("windows", "amd64", ".exe"),
      ]

      links = [
          {"name": f"{binary}-{g}-{a}{e}", "url": f"{base}/{binary}-{g}-{a}{e}", "link_type": "package"}
          for g, a, e in platforms
      ]

      desc = "## 各平台安装\n\n" + "\n\n".join(
          f"### {g}/{a}\n```bash\ncurl -L \"{base}/{binary}-{g}-{a}{e}\" -o /usr/local/bin/{binary}\nchmod +x /usr/local/bin/{binary}\n```"
          for g, a, e in platforms
      )

      payload = {"name": version, "tag_name": version, "description": desc, "assets": {"links": links}}

      req = urllib.request.Request(
          api,
          data=json.dumps(payload).encode(),
          headers={"JOB-TOKEN": token, "Content-Type": "application/json"},
          method="POST"
      )
      try:
          with urllib.request.urlopen(req) as resp:
              d = json.load(resp)
              print(f"  Release 创建成功: {d['name']}")
      except urllib.error.HTTPError as e:
          d = json.load(e)
          print(f"  注意: {d.get('message','')}")
      PYEOF
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
